<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Hope, Inc. ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="card">
  <div class="logo" aria-hidden="true">H</div>
  <h1>Welcome back</h1>
  <p class="sub">Sign in to your Hope, Inc. ERP account</p>

  <div class="demo">
    <strong>Demo accounts available:</strong>
    superadmin@hope.com (Superadmin)<br>admin@hope.com (Admin)
  </div>

  <form novalidate>
    <div class="field">
      <label for="email">Email address</label>
      <input id="email" type="email" placeholder="account@gmail.com" autocomplete="email" required>
      <div class="error" role="alert"></div>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <div class="input has-icon">
        <button type="button" class="icon-btn" data-toggle-password="password" aria-label="Show password"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <div class="error" role="alert"></div>
    </div>
    <div class="meta">
      <label class="check"><input type="checkbox"> Remember me</label>
      <a href="reset-password.html">Forgot password?</a>
    </div>
    <button class="btn btn-primary" type="submit">Sign in</button>
  </form>

  <div class="divider">or</div>
  <button class="btn btn-ghost" type="button"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg> Continue with Google</button>

  <p class="foot">Don't have an account? <a href="register.html">Register</a></p>
</main>
<script src="auth.js"></script>
</body>
</html>
