<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Management · Hope, Inc. ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <link rel="stylesheet" href="../css/erp-modules.css" />
</head>
<body>
  <div class="erp-layout">
    <!-- Sidebar -->
    <aside class="erp-sidebar">
      <div class="sidebar-brand">
        <div class="brand-logo">H</div>
        <span class="brand-name">Hope, Inc. ERP</span>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <label for="role-switcher" class="role-demo-label">Demo Role Switcher:</label>
        <select id="role-switcher" class="role-switcher">
          <option value="Superadmin">Superadmin (Michael)</option>
          <option value="Admin">Admin (Lisa)</option>
          <option value="User">User (Alex)</option>
        </select>
        <button id="logout-btn" class="btn-logout">Sign Out</button>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="erp-main" style="width: 100%;">
      <header class="erp-topbar">
        <h1 class="page-title">Customer Management</h1>
        <span class="role-badge" id="role-badge">SUPERADMIN</span>
      </header>

      <section class="module-card">
        <!-- Toolbar -->
        <div class="module-toolbar">
          <div class="toolbar-left">
            <h2 style="font-size: 16px; font-weight: 700;">Customer Management</h2>
            <!-- Filter Tabs (Hidden for User role per Figure 10) -->
            <div class="filter-tabs" id="status-tabs">
              <button class="filter-tab active" data-filter="Active" id="tab-active">Active (0)</button>
              <button class="filter-tab" data-filter="Inactive" id="tab-inactive">Inactive (0)</button>
              <button class="filter-tab" data-filter="All" id="tab-all">All (0)</button>
            </div>
          </div>

          <div class="toolbar-right">
            <input type="text" id="search-input" class="search-input" placeholder="Search customers..." />
            <button class="btn btn-primary" id="btn-add-customer">+ Add Customer</button>
          </div>
        </div>

        <!-- Data Table -->
        <div class="table-wrap">
          <table class="erp-table">
            <thead>
              <tr>
                <th>CUST NO</th>
                <th>CUSTOMER NAME</th>
                <th>ADDRESS</th>
                <th>PAY TERMS</th>
                <th class="admin-only-col">STATUS</th>
                <th class="admin-only-col">STAMP</th>
                <th>ACTIONS</th>
              </tr>
            </thead>
            <tbody id="customers-tbody">
              <!-- Populated by js/customers.js -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- Add / Edit Customer Modal -->
  <div class="modal-backdrop" id="customer-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="modal-title">Add Customer</h3>
        <button type="button" class="icon-btn" id="btn-close-modal" style="position:static;transform:none;">✕</button>
      </div>
      <form id="customer-form">
        <div class="modal-body">
          <div class="field">
            <label for="custNo">Customer No.</label>
            <input type="text" id="custNo" readonly />
            <div class="hint">Auto-generated primary key</div>
          </div>
          <div class="field">
            <label for="custName">Customer Name</label>
            <input type="text" id="custName" required placeholder="e.g. Acme Corporation" />
          </div>
          <div class="field">
            <label for="address">Address</label>
            <input type="text" id="address" required placeholder="e.g. 123 Main St, Metro City" />
          </div>
          <div class="field" style="margin-bottom:0;">
            <label for="payTerms">Payment Terms</label>
            <select id="payTerms" required>
              <option value="COD">COD (Cash on Delivery)</option>
              <option value="Net 15">Net 15</option>
              <option value="Net 30" selected>Net 30</option>
              <option value="Net 45">Net 45</option>
              <option value="Prepaid">Prepaid</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" id="btn-cancel-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Customer</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/customers.js"></script>
</body>
</html>
