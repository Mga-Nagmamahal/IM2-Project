
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Management · Hope, Inc. ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <link rel="stylesheet" href="../css/erp-modules.css" />
</head>
<body>
  <div class="erp-layout">
    <!-- Sidebar -->
    <aside class="erp-sidebar">
      <div class="sidebar-brand">
        <div class="brand-logo">H</div>
        <span class="brand-name">Hope, Inc. ERP</span>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <label for="role-switcher" class="role-demo-label">Demo Role Switcher:</label>
        <select id="role-switcher" class="role-switcher">
          <option value="Superadmin">Superadmin (Michael)</option>
          <option value="Admin">Admin (Lisa)</option>
          <option value="User">User (Alex)</option>
        </select>
        <button id="logout-btn" class="btn-logout">Sign Out</button>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="erp-main" style="width: 100%;">
      <header class="erp-topbar">
        <h1 class="page-title">Product Management</h1>
        <span class="role-badge" id="role-badge">SUPERADMIN</span>
      </header>

      <section class="module-card">
        <!-- Toolbar -->
        <div class="module-toolbar">
          <div class="toolbar-left">
            <h2 style="font-size: 16px; font-weight: 700;">Product Management</h2>
            <div class="filter-tabs" id="prod-status-tabs">
              <button class="filter-tab active" data-filter="Active" id="prod-tab-active">Active (0)</button>
              <button class="filter-tab" data-filter="Inactive" id="prod-tab-inactive">Inactive (0)</button>
              <button class="filter-tab" data-filter="All" id="prod-tab-all">All (0)</button>
            </div>
          </div>

          <div class="toolbar-right">
            <input type="text" id="prod-search" class="search-input" placeholder="Search products..." />
            <button class="btn btn-primary" id="btn-add-product">+ Add Product</button>
          </div>
        </div>

        <!-- Products Table -->
        <div class="table-wrap">
          <table class="erp-table">
            <thead>
              <tr>
                <th>PROD CODE</th>
                <th>DESCRIPTION</th>
                <th>UNIT</th>
                <th>CURRENT PRICE</th>
                <th class="admin-only-col">STATUS</th>
                <th class="admin-only-col">STAMP</th>
                <th>ACTIONS</th>
              </tr>
            </thead>
            <tbody id="products-tbody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- 1. Add / Edit Product Modal -->
  <div class="modal-backdrop" id="product-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="prod-modal-title">Add Product</h3>
        <button type="button" class="icon-btn" id="btn-close-prod-modal" style="position:static;transform:none;">✕</button>
      </div>
      <form id="product-form">
        <div class="modal-body">
          <div class="field">
            <label for="prodCode">Product Code</label>
            <input type="text" id="prodCode" readonly />
            <div class="hint">Auto-generated primary key</div>
          </div>
          <div class="field">
            <label for="prodDesc">Description</label>
            <input type="text" id="prodDesc" required placeholder="e.g. Industrial Widget A" />
          </div>
          <div class="field" style="margin-bottom:0;">
            <label for="prodUnit">Unit of Measure</label>
            <select id="prodUnit" required>
              <option value="pcs">pcs (Pieces)</option>
              <option value="can">can (Can)</option>
              <option value="pair">pair (Pair)</option>
              <option value="meter">meter (Meter)</option>
              <option value="pkg">pkg (Package)</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" id="btn-cancel-prod-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Product</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 2. Price History Child Modal (Figures 12 & 13) -->
  <div class="modal-backdrop" id="price-modal">
    <div class="modal-dialog modal-lg">
      <div class="modal-header">
        <div>
          <h3 id="price-modal-title">Price History — P-001</h3>
          <p id="price-modal-subtitle" style="font-size:12.5px;color:var(--muted);margin-top:2px;"></p>
        </div>
        <button type="button" class="icon-btn" id="btn-close-price-modal" style="position:static;transform:none;">✕</button>
      </div>

      <div class="modal-body">
        <!-- Toolbar inside Price History Modal -->
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;">
          <div class="filter-tabs" id="price-status-tabs">
            <button class="filter-tab active" data-pfilter="Active" id="ptab-active">Active</button>
            <button class="filter-tab" data-pfilter="Inactive" id="ptab-inactive">Inactive</button>
            <button class="filter-tab" data-pfilter="All" id="ptab-all">All</button>
          </div>
          <button type="button" class="btn btn-primary btn-sm" id="btn-toggle-price-form">+ Add Price</button>
        </div>

        <!-- Inline Add/Edit Price Form -->
        <form id="price-entry-form" style="display:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:14px;margin-bottom:16px;">
          <div class="row2" style="align-items:end;">
            <div class="field" style="margin-bottom:0;">
              <label for="priceEffDate">Effective Date</label>
              <input type="date" id="priceEffDate" required />
            </div>
            <div class="field" style="margin-bottom:0;">
              <label for="priceAmount">Unit Price ($)</label>
              <input type="number" id="priceAmount" step="0.01" min="0.01" required placeholder="0.00" />
            </div>
          </div>
          <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px;">
            <button type="button" class="btn btn-ghost btn-sm" id="btn-cancel-price-entry">Cancel</button>
            <button type="submit" class="btn btn-primary btn-sm">Save Price</button>
          </div>
        </form>

        <!-- Price History Table -->
        <div class="table-wrap" style="border:1px solid var(--line);border-radius:var(--radius-md);">
          <table class="erp-table">
            <thead>
              <tr>
                <th>EFFECTIVE DATE</th>
                <th>UNIT PRICE</th>
                <th class="admin-only-col">STATUS</th>
                <th class="admin-only-col">STAMP</th>
                <th>ACTIONS</th>
              </tr>
            </thead>
            <tbody id="price-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/products.js"></script>
</body>
</html>
