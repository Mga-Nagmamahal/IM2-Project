<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password · Hope, Inc. ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<main class="card">
  <div class="logo" aria-hidden="true">H</div>
  <h1>Reset your password</h1>
  <p class="sub">Enter your email and we'll send you a reset link</p>

  <form novalidate>
    <div class="field">
      <label for="email">Email address</label>
      <input id="email" type="email" placeholder="account@gmail.com" autocomplete="email" required>
      <div class="error" role="alert"></div>
    </div>
    <div class="notice" role="status">If an account exists for that email, a reset link is on its way.</div>
    <button class="btn btn-primary" type="submit">Send reset link</button>
  </form>

  <p class="foot"><a href="login.html">Back to sign in</a></p>
</main>
<script src="views/auth.js"></script>
</body>
</html>
